version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - FRONTEND_ORIGIN=http://localhost:80,http://localhost,http://127.0.0.1,http://localhost:5173
      - PORT=8080
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - VITE_API_BASE=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
