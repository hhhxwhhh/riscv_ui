version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - FRONTEND_ORIGIN=http://localhost:80,http://localhost,http://127.0.0.1

  frontend:
    build:
      context: .
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE=http://localhost:8080
    depends_on:
      - backend
